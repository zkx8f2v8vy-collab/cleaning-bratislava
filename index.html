<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Upratovanie bytov v Bratislave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lead-box {
      background: #ffffff;
      max-width: 420px;
      width: 90%;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }

    .lead-box h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .lead-box p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .lead-box input,
    .lead-box textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    .lead-box textarea {
      resize: none;
      height: 80px;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: #00e5c0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .whatsapp {
      margin-top: 15px;
    }

    .whatsapp a {
      display: block;
      padding: 12px;
      border-radius: 8px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="lead-box">
  <h1>Upratovanie bytov v Bratislave</h1>
  <p>Zanechajte žiadosť – ozveme sa vám do 10 minút</p>

  <form id="leadForm">
    <input type="text" name="name" placeholder="Vaše meno" required>
    <input type="tel" name="phone" placeholder="Telefónne číslo" required>
    <textarea name="message" placeholder="Čo potrebujete upratať?"></textarea>
    <button type="submit" class="btn-main">Odoslať žiadosť</button>
  </form>

  <div class="whatsapp">
    <a href="https://wa.me/421952310500" target="_blank">
      Napísať na WhatsApp
    </a>
  </div>
</div>

<script>
document.getElementById("leadForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = this.name.value;
  const phone = this.phone.value;
  const message = this.message.value;

  const text =
`🧹 Nová žiadosť – Bratislava
👤 Meno: ${name}
📞 Telefón: ${phone}
📝 Požiadavka: ${message}`;

  fetch("https://api.telegram.org/bot8588028264:AAGeCVR2u1xSM1BWM9PvYZEyXguOdZXau1o/sendMessage", {

    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: "8244154828",

      text: text
    })
  }).then(() => {
    alert("Ďakujeme! Ozveme sa vám čoskoro.");
    document.getElementById("leadForm").reset();
  });
});
</script>

</body>
</html>
